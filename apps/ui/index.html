<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <title>DMaker</title>
    <meta name="description" content="Build software autonomously with AI agents" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      // Prevent theme flash - apply stored theme before React hydrates
      (function () {
        // Kept in sync with DEFAULT_GLOBAL_SETTINGS.theme in @dmaker/types
        const DEFAULT_THEME = 'catppuccin';
        try {
          let theme = DEFAULT_THEME;
          const stored = localStorage.getItem('dmaker-storage');
          if (stored) {
            const data = JSON.parse(stored);
            if (data.state?.theme) theme = data.state.theme;
          }
          if (theme !== 'system' && theme !== 'light') {
            // Apply the actual theme class (dark, catppuccin, retro, dracula, nord, etc.)
            document.documentElement.classList.add(theme);
          } else if (
            theme === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          ) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="app"></div>
    <script type="module" src="/src/renderer.tsx"></script>
  </body>
</html>
